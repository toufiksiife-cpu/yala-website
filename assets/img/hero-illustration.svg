<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" aria-label="YALA language school illustration" role="img" preserveAspectRatio="xMidYMid meet">
  <rect width="800" height="420" fill="#F5F7FA"/>
  <!-- Abstract geometric book / calligraphy -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <!-- Large navy circle -->
    <circle cx="200" cy="210" r="120" fill="#1E456F" opacity="0.08" stroke="#1E456F"/>
    <!-- Green arc -->
    <path d="M 120 280 Q 200 120 300 280" stroke="#7CB73E" stroke-width="8"/>
    <!-- Teal arc -->
    <path d="M 350 100 Q 480 300 560 140" stroke="#2D9D97" stroke-width="6"/>
    <!-- Orange accent -->
    <circle cx="580" cy="120" r="28" fill="#F18225" opacity="0.85"/>
    <!-- Abstract Arabic-style curved letter -->
    <path d="M 90 320 Q 140 220 240 280 T 420 240" stroke="#1E456F" stroke-width="5"/>
    <!-- Book pages -->
    <rect x="480" y="160" width="140" height="110" rx="8" fill="#FFFFFF" stroke="#1E456F" stroke-width="2"/>
    <line x1="550" y1="160" x2="550" y2="270" stroke="#E3E8EF" stroke-width="2"/>
    <line x1="490" y1="215" x2="610" y2="215" stroke="#E3E8EF" stroke-width="2"/>
    <path d="M 495 225 Q 525 190 555 225" stroke="#F18225" stroke-width="3" fill="none"/>
    <path d="M 495 235 Q 525 200 555 235" stroke="#2D9D97" stroke-width="2" fill="none"/>
  </g>
  <text x="640" y="380" font-family="Cairo, system-ui, sans-serif" font-size="14" fill="#55627A" text-anchor="end" letter-spacing="2">YALA · TLEMCE Ν</text>
</svg>